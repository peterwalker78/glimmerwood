[package]
name = "glimmerwood-macos"
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Glimmerwood on macOS"
publish = false

[[bin]]
name = "glimmerwood"
path = "src/main.rs"

[build-dependencies]
glimmerwood-embed = { path = "../embed" }

[dependencies]
glimmerwood-core = { path = "../core" }
glimmerwood-raster = { path = "../raster" }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# WebKit answers some delegate methods through a block; this is the
# runtime's own handling of them rather than a hand-laid struct.
block2 = "0.6"
# WebKit is the system engine here, the same family as WebKitGTK on Linux,
# so the page is rendered by the same lineage on both.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSGraphics",
    "NSColor",
    "NSRunningApplication",
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    # The wisp's nook: a view of its own over the toolbar, the pixels the
    # rasteriser hands it, and the system's word on dark mode and motion.
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSTrackingArea",
    "NSAppearance",
    "NSWorkspace",
    "NSAccessibility",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSData",
    "NSGeometry",
    "NSDictionary",
    "NSError",
    "NSJSONSerialization",
    "NSTimeZone",
    "NSTimer",
    "NSDate",
    "NSRunLoop",
    "NSNotification",
    "NSURLError",
    "NSURLAuthenticationChallenge",
    "NSURLProtectionSpace",
    "NSURLCredential",
    "NSURLSession",
    "NSArray",
    # The wisp's clock, which moves forward whatever the wall clock does.
    "NSProcessInfo",
] }
objc2-web-kit = { version = "0.3", features = [
    "WKWebView",
    "WKWebViewConfiguration",
    "WKURLSchemeHandler",
    "WKURLSchemeTask",
    "WKUserContentController",
    "WKScriptMessageHandler",
    "WKScriptMessage",
    "WKNavigationDelegate",
    "WKNavigation",
    "WKNavigationAction",
    # Find in page, and how large a site is drawn.
    "WKFindConfiguration",
    "WKFindResult",
    "block2",
    "objc2-core-foundation",
] }
