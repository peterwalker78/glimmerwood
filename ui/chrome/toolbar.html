<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Glimmerwood</title>
  <link rel="stylesheet" href="chrome.css">
  <script type="module" src="toolbar.js"></script>
</head>
<body class="toolbar-page">
  <nav id="bar" class="bar">
    <button id="back" class="step" type="button" aria-label="Back" title="Back (Alt+Left)" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3.5M7.5 4 3.5 8l4 4"/></svg>
    </button>
    <button id="forward" class="step" type="button" aria-label="Forward" title="Forward (Alt+Right)" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9.5M8.5 4l4 4-4 4"/></svg>
    </button>
    <button id="reload" class="step" type="button" aria-label="Reload" title="Reload (Ctrl+R)">
      <svg class="when-idle" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.6 9.5A4.8 4.8 0 1 1 11.3 4.6M12.2 2v3h-3"/></svg>
      <svg class="when-loading" viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7"/></svg>
    </button>
    <button id="home" class="step" type="button" aria-label="Home" title="Home (Alt+Home)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.8 7.4 8 3l5.2 4.4M4.3 6.3v6.7h2.9V9.6h1.6V13h2.9V6.3"/></svg>
    </button>
    <form id="address-form" class="address" role="search">
      <input id="address" type="text" spellcheck="false" autocomplete="off" autocapitalize="off"
             placeholder="Search, or type an address" aria-label="Address">
      <span id="security" class="security" hidden>not private</span>
    </form>
    <form id="find-form" class="find" role="search" hidden>
      <input id="find" type="text" spellcheck="false" autocomplete="off" autocapitalize="off"
             placeholder="Find in page" aria-label="Find in page" aria-describedby="find-summary">
      <span id="find-summary" class="find-summary" aria-live="polite"></span>
      <button id="find-previous" class="step" type="button" aria-label="Previous match" title="Previous match (Shift+Enter)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 10 4-4 4 4"/></svg>
      </button>
      <button id="find-next" class="step" type="button" aria-label="Next match" title="Next match (Enter)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
      </button>
      <button id="find-close" class="step" type="button" aria-label="Close find" title="Close (Escape)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7"/></svg>
      </button>
    </form>
    <button id="bookmark" class="step star" type="button" aria-label="Bookmark this page" aria-pressed="false" title="Bookmark (Ctrl+D)" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2l1.75 3.6 3.95.55-2.87 2.77.7 3.93L8 11.2l-3.53 1.85.7-3.93L2.3 6.35l3.95-.55z"/></svg>
    </button>
    <!-- The wisp's nook. The wisp itself is drawn natively on top of it; the
         button gives it keyboard focus and a name. -->
    <button id="wisp" class="nook" type="button" aria-label="The wisp" aria-describedby="caption"></button>
    <div id="window-buttons" class="window-buttons" hidden>
      <button id="minimize" class="step" type="button" aria-label="Minimise">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8.5h8"/></svg>
      </button>
      <button id="maximize" class="step" type="button" aria-label="Maximise">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5h7v7h-7z"/></svg>
      </button>
      <button id="close" class="step" type="button" aria-label="Close window">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7"/></svg>
      </button>
    </div>
  </nav>
  <div id="progress" class="progress" hidden></div>
  <aside id="caption" class="caption" role="tooltip" hidden>
    <ul id="caption-lines"></ul>
  </aside>
  <!-- On a site where someone may be in crisis, the wisp stays close and
       quietly offers someone to talk to. It never takes focus and never
       blocks the page. -->
  <aside id="care" class="ask care" aria-labelledby="care-title" hidden>
    <button id="care-close" class="step ask-close" type="button" aria-label="Close" title="Close">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7"/></svg>
    </button>
    <p id="care-title" class="ask-question"><strong>I'm here with you.</strong></p>
    <p class="care-text">If things feel heavy right now, you don't have to hold them alone. Someone can listen, free and in confidence, at any hour.</p>
    <div class="ask-actions">
      <button id="care-samaritans" class="ask-link" type="button" hidden>Samaritans, 116 123</button>
      <button id="care-find" class="ask-keep" type="button">Find someone to talk to</button>
    </div>
  </aside>
  <!-- The wisp asking how a site it hasn't met leaves the user. It never
       takes focus on its own and closes when the user leaves the site. -->
  <aside id="ask" class="ask" aria-labelledby="ask-question" hidden>
    <button id="ask-close" class="step ask-close" type="button" aria-label="Not now" title="Not now">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7"/></svg>
    </button>
    <p id="ask-question" class="ask-question">I haven't met <strong id="ask-site"></strong> before. How does it leave you?</p>
    <div id="ask-scale"></div>
    <p class="ask-honest">Only you see this. I can only look after you if it's true.</p>
    <div class="ask-actions">
      <button id="ask-unrated" class="ask-link" type="button">Leave it unrated</button>
      <button id="ask-settings" class="ask-link" type="button">Settings</button>
      <button id="ask-keep" class="ask-keep" type="button">Keep</button>
    </div>
  </aside>
</body>
</html>
