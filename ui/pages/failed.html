<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <meta name="color-scheme" content="light dark">
  <title>{{title}}</title>
  <style>
    :root { --paper: #ecece8; --ink: #2a2b28; --quiet: #797b75; --hairline: rgb(42 43 40 / 0.14); }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #1d1e1c; --ink: #d9dad5; --quiet: #8b8d87; --hairline: rgb(217 218 213 / 0.14); }
    }
    html { background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, "Noto Sans", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 0 24px; }
    main { max-width: 34rem; padding-bottom: 12vh; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; overflow-wrap: anywhere; }
    p { margin: 0 0 22px; color: var(--quiet); }
    a { color: var(--ink); text-decoration: none; border: 1px solid var(--hairline); border-radius: 7px; padding: 6px 14px; }
    a:hover, a:focus-visible { border-color: var(--quiet); outline: none; }
  </style>
</head>
<body>
  <main>
    <h1>{{title}}</h1>
    <p>{{detail}}</p>
    <a href="{{uri}}">Try again</a>
  </main>
</body>
</html>
