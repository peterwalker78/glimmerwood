[package]
name = "glimmerwood-raster"
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The wisp, drawn into a buffer of pixels"
publish = false

[dependencies]
glimmerwood-core = { path = "../core" }
# One software rasteriser, in Rust, rather than Direct2D on Windows and Core
# Graphics on macOS: two platform graphics stacks, two piles of unsafe, and
# nowhere to test either of them. The wisp is 152x56 and asks for 2-6 frames a
# second, so a CPU is more than enough to draw it.
tiny-skia = "0.12"
