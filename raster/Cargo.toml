[package]
name = "glimmerwood-raster"
version = "0.9.2"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The wisp, drawn into a buffer of pixels"
publish = false

[dependencies]
glimmerwood-core = { path = "../core" }
# A software rasteriser, in Rust, so the wisp can be drawn and compared
# anywhere without a toolkit under it. The wisp is 152x56 and asks for 2-6
# frames a second, so a CPU is more than enough to draw it.
tiny-skia = "0.12"
