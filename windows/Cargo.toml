[package]
name = "glimmerwood-windows"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Glimmerwood on Windows"
publish = false

[[bin]]
name = "glimmerwood"
path = "src/main.rs"

[build-dependencies]
glimmerwood-embed = { path = "../embed" }

[dependencies]
glimmerwood-core = { path = "../core" }
glimmerwood-raster = { path = "../raster" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# WebView2 is the Edge engine Windows already has. Nothing is bundled: if a
# machine has no WebView2 runtime, the app says so rather than shipping one.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_Globalization",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
