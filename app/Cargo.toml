[package]
name = "glimmerwood"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A minimalist browser with a living companion"
publish = false

[dependencies]
glimmerwood-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
webkit = { package = "webkit6", version = "0.6" }
serde_json = "1"
