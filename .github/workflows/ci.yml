name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The core has no platform in it, and neither has the surface Windows and
  # macOS will draw the wisp on. This is what says so: both build and run
  # their tests on all three, with no GTK or WebKit anywhere in sight, and
  # the wisp has to come out identical on each.
  core:
    name: core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: cargo test --locked -p glimmerwood-core -p glimmerwood-raster
      - run: cargo clippy --locked -p glimmerwood-core -p glimmerwood-raster --all-targets -- -D warnings

  # The GTK build, on the toolchain it is developed against.
  linux:
    name: the GTK app
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cargo rust clippy rustfmt gcc pkgconf-pkg-config \
            gtk4-devel webkitgtk6.0-devel sqlite-devel glib2-devel \
            git tar findutils curl
      - uses: actions/checkout@v4
      # There is no distrobox here, so this runs where it stands.
      - name: Check
        run: scripts/check
      # The pinned tsc is a Linux binary, so the chrome is built once here and
      # the other platforms are handed the result.
      - uses: actions/upload-artifact@v4
        with:
          name: chrome
          path: ui/dist

  # Windows has no WebKit of any kind, so its shell is WebView2 over the same
  # core. This builds it for real: type-checking would miss the linking.
  windows:
    name: the Windows shell
    runs-on: windows-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: actions/download-artifact@v4
        with:
          name: chrome
          path: ui/dist
      - run: cargo build --locked --release -p glimmerwood-windows
      - run: cargo clippy --locked -p glimmerwood-windows -- -D warnings
      - name: Gather it up
        shell: bash
        run: |
          mkdir -p out
          cp target/release/glimmerwood.exe out/
          cp target/release/WebView2Loader.dll out/
      - uses: actions/upload-artifact@v4
        with:
          name: glimmerwood-windows-x64
          path: out

  # macOS has WebKit itself, the same family as the WebKitGTK the Linux build
  # uses, so the page is rendered by the same lineage on both.
  macos:
    name: the macOS shell
    runs-on: macos-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: actions/download-artifact@v4
        with:
          name: chrome
          path: ui/dist
      - run: cargo build --locked --release -p glimmerwood-macos
      - run: cargo clippy --locked -p glimmerwood-macos -- -D warnings
      - name: Make it an app
        run: scripts/macos-app target/release/glimmerwood out/Glimmerwood.app
      - uses: actions/upload-artifact@v4
        with:
          name: glimmerwood-macos
          path: out
