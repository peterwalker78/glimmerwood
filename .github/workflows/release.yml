name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: glimmerwood-x86_64.flatpak
          manifest-path: flatpak/io.github.peterwalker78.Glimmerwood.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: glimmerwood-linux
          path: glimmerwood-x86_64.flatpak

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [linux]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Before the artifacts: a checkout tidies away anything untracked.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: glimmerwood-*
          merge-multiple: true
          path: built
      - name: Checksums
        run: cd built && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: built/*
          body_path: .github/release-notes.md
          generate_release_notes: true
