[package]
name = "wisp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A minimalist browser with a living companion"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
webkit = { package = "webkit6", version = "0.6" }
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
