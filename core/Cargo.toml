[package]
name = "glimmerwood-core"
version = "0.8.2"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Everything about Glimmerwood that is true wherever it runs"
publish = false

[lib]
name = "glimmerwood_core"

[dependencies]
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
# Rewrites the user's own reputation file without losing their comments.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

# Linux and macOS both have SQLite already, and a Flatpak would rather use the
# runtime's copy so it keeps getting its security updates. Windows has none, so
# there it is compiled in.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
