# Good places Home can offer. Every page must fall under an entry on a
# nourishing list in reputation.toml (a test checks). Each was loaded and
# checked on 15 September 2026: no infinite feed, autoplay-next, streaks or
# leaderboards, no login or paywall, and few or no ads.
#
#   entry    the reputation-list entry the page falls under
#   url      the page to open
#   kinds    what kind of good it does, the main one first
#   moments  when in the day it suits: morning, day, evening, night
#            (night only for dim, quiet things)
#   seasons  months it suits, if not all year
#   fresh    its content renews daily or weekly
#   region   "uk" for places only offered in the UK, else "intl"

# Hours between new picks. Within a stretch Home offers the same places.
rotate_hours = 2

# --------------------------------------------------------------------------
# Nature, live and recorded. Short spells of virtual nature restore about as
# well as real nature for stress (meta-analysis of 10 studies, 2024), and
