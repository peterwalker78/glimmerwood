# Home: the words it can say and the good places it can offer.
#
# Tone: warm, plain, never a statistic, never an instruction, never about what
# went badly. Praise is only ever shown when it is true; when nothing stands
# out Home just says hello.

[moments]
# Local hours where each part of the day begins. Night ends at the start of
# the morning.
morning = 5
day = 12
evening = 18
night = 23

[welcome]
morning = "Good morning"
day = "Good afternoon"
evening = "Good evening"
night = "It's late"

# One of these follows the welcome when nothing more useful comes first.
[quiet]
morning = ["Where would you like to begin?", "A fresh start. Take your time."]
day = ["Where to next?", "Somewhere good, perhaps."]
evening = ["Somewhere calm for the evening?", "The day's winding down."]
night = ["Go gently. Sleep does the most good.", "Somewhere quiet, if anywhere."]

# The wisp introduces itself in a speech bubble in the garden, until the user
# dismisses it.
[about]
title = "Hello. I'm your wisp."
paragraphs = [
  "Glimmerwood is a web browser that keeps you company. Some corners of the web leave you rested and brighter; others are built to keep you scrolling long after they stop doing you any good. I notice which is which.",
  "You'll see it in me, up at the top of the window, the way you see weather: bright after time away or somewhere kind, clouded and sleepy after a long stretch of endless feeds. Hover over me to see what's moving me, and click me to look back over our days.",
  "I'll never block a page or tell you off. The idea is simply that noticing helps: more of your time going to things that restore you, less of it lost to the feed, and gentler evenings before sleep. Time away from the screen does us both the most good.",
  "This garden grows on good days and never wilts. Everything I notice stays on this computer.",
]
done = "Got it"

# Explanations, each shown until the user says "Got it", once the user has met
# the thing they explain.
[explain]
draining = "Earlier the wisp grew heavy. Some sites are built to keep you scrolling, and the wisp feels that weight. It lifts again when you step away or spend time somewhere kinder."
night = "Late at night the wisp winds down with you. Late scrolling weighs a little more and restful pages rest a little less, because sleep does the most good of all."
privacy = "On some private sites the wisp turns away and gives you privacy. Nothing about those visits is counted or kept."
heard = "Tabs playing sound count too, even off screen: a tab in the background counts for half, and one you mute from its speaker mark counts for nothing. After an hour without a touch, or twenty minutes at night, the wisp takes it that you've stepped away or dozed off. It only knows that a tab is making sound, never what it is, and it never uses your microphone."

# Praise, only when it's true. The first that applies is said.
[praise]
garden = ["The garden grew a little yesterday.", "Something new came up in the garden."]
break = ["You took a proper break earlier. That's the good stuff.", "You stepped away for a while today. The wisp noticed."]
restoring = ["You've given real time to things that restore you this week.", "This week has had plenty of the good kind of time."]
gentle = ["Today's been gentle so far.", "A kind sort of day so far."]
calm_night = ["Last night stayed calm after dark.", "You kept last night peaceful."]
rested = ["Welcome back. The wisp is well rested.", "Good to see you. Everything's had time to settle."]

[thresholds]
# A proper break: minutes away in one go, after being here earlier that day.
break_minutes = 30
# A week with this many minutes on nourishing sites earns the restoring line.
restoring_minutes = 60
# A gentle day: at least this much time present, with a draining load (weighted
# minutes, as in the dose model) below `gentle_load`.
gentle_present_minutes = 30
gentle_load = 30.0
# Away this long, and the dose below Engaged, earns the rested welcome.
rested_away_minutes = 120
# A place counts as one of the user's own after this many minutes on it in
# the last 30 days.
own_place_minutes = 20
