# Good news for a feed reader. Every feed was fetched on 22 September 2026:
# RSS or Atom, updated that month, readable without a login.
#
#   site   the reputation-list entry its stories open under; it must be on a
#          nourishing list (a test checks)
#   url    the feed itself
#   name   what the reader calls it
#   kind   working  reports what is working on real problems
#          light    feel-good, and labelled so
#          awe      nature, space, art or human achievement

